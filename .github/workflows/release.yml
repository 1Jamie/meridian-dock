name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version number. Leave empty to use metadata.json.
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        if: ${{ inputs.version != '' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 - << 'PY'
          import json
          import os
          path = "metadata.json"
          meta = json.load(open(path))
          meta["version"] = int(os.environ["RELEASE_VERSION"])
          with open(path, "w") as handle:
              json.dump(meta, handle, indent=2)
              handle.write("\n")
          PY

      - name: Pack
        run: bash scripts/pack.sh dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("metadata.json"))["version"])')
          tag="v${version}"
          gh release create "$tag" dist/meridian-dock@autumn.shell-extension.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --notes "gnome shell 50 pack. install with: gnome-extensions install meridian-dock@autumn.shell-extension.zip"
